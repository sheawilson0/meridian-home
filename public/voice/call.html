<!doctype html>
<html lang="en">
<head>
<script src="/lab-guard.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Call Meridian">
<meta name="theme-color" content="#161618">
<title>Call Meridian</title>
<link rel="icon" href="/dashboard-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/dashboard-icon-180.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/voice/voice.css">
<style>
/* Phone: ring Meridian. A call screen on top; the draft, live and coloured, underneath. */
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.screen{min-height:calc(100svh - env(safe-area-inset-top) - env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;padding:28px 22px 26px;gap:14px}
.who{text-align:center}
.who .name{font-size:28px;font-weight:500;letter-spacing:-.01em}
.who .sub{color:var(--dim);font-size:14px;margin-top:2px}
.avatar{margin-top:18px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3a3a40,#1d1d20);display:grid;place-items:center;position:relative}
.avatar::after{content:'';position:absolute;inset:-10px;border-radius:50%;border:2px solid var(--w-voice);opacity:0;transform:scale(calc(1 + var(--lvl,0) * .22));transition:transform .08s linear,opacity .3s}
body[data-call="live"] .avatar::after{opacity:.85}
.avatar img{width:64px;height:64px;opacity:.9}
.captions{width:100%;flex:1;min-height:90px;max-height:none;justify-content:flex-end;font-size:16px;text-align:center}
.engines{width:100%}
.buttons{display:flex;gap:28px;align-items:center;justify-content:center}
.round{width:66px;height:66px;border-radius:50%;background:var(--raised);display:grid;place-items:center}
.round svg{width:26px;height:26px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.round[aria-pressed="true"]{background:var(--ink)} .round[aria-pressed="true"] svg{stroke:#111}
.round:disabled{opacity:.35}
.talk{width:78px;height:78px;background:#2fbf71}
.talk[data-state="live"]{background:var(--live)}
.lbl{font-size:12px;color:var(--dim);text-align:center;margin-top:6px}
.draft{padding:8px 22px 60px}
.draft h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);font-weight:500;margin:0 0 10px;display:flex;justify-content:space-between}
#preview{background:var(--well);border-radius:14px;padding:14px 16px;white-space:pre-wrap;line-height:1.55;font-size:15px}
.pv-to{font-size:13.5px;margin-bottom:4px} .pv-subject{font-weight:600;margin-bottom:10px}
.nodraft #preview{display:none}
</style>
</head>
<body class="nodraft" data-call="idle">
<section class="screen">
  <div class="who"><div class="name">Meridian</div><div class="sub" id="title">No draft yet: ask for one</div></div>
  <div class="avatar" id="avatar"><img src="/meridian-icon.svg" alt=""></div>
  <div class="small dim" id="status">Ready</div>
  <div class="captions" id="captions" aria-live="polite"></div>
  <div class="warn" id="keywarn" hidden>No OpenAI key on Home yet, so calls won't connect.</div>
  <div class="seg engines" id="engines" aria-label="Engine"></div>
  <select id="voice" aria-label="Voice" style="width:100%"></select>
  <div class="small dim" id="meter"></div>
  <div class="buttons">
    <div><button class="round" id="mute" aria-pressed="false" disabled aria-label="Mute"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M4 4l16 16"/></svg></button><div class="lbl">Mute</div></div>
    <div><button class="round talk" id="talk" data-state="idle" aria-label="Call"><svg viewBox="0 0 24 24"><path d="M5 4h3l2 5-2 1a11 11 0 0 0 6 6l1-2 5 2v3a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg></button><div class="lbl">Call</div></div>
  </div>
</section>
<section class="draft">
  <h2><span id="kind">Draft</span><a id="laptop" href="/voice/index.html">Open on laptop</a></h2>
  <div id="preview"></div>
  <p class="small dim" id="last"></p>
  <p class="small dim" id="today"></p>
</section>
<script src="/voice/voice-core.js"></script>
<script src="/voice/voice-page.js"></script>
<script>
// Keep the screen awake during a call where Safari allows it.
let lock = null;
new MutationObserver(async () => {
  try {
    if (document.body.dataset.call === 'live' && !lock && navigator.wakeLock) lock = await navigator.wakeLock.request('screen');
    if (document.body.dataset.call === 'idle' && lock) { await lock.release(); lock = null; }
    document.querySelector('#talk + .lbl').textContent = document.body.dataset.call === 'idle' ? 'Call' : 'End';
  } catch { /* not allowed */ }
}).observe(document.body, { attributes: true, attributeFilter: ['data-call'] });
document.getElementById('avatar').style.setProperty('--lvl', 0);
new MutationObserver(() => document.getElementById('avatar').style.setProperty('--lvl', document.getElementById('talk').style.getPropertyValue('--lvl') || 0))
  .observe(document.getElementById('talk'), { attributes: true, attributeFilter: ['style'] });
</script>
</body>
</html>
