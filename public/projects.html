<!doctype html>
<html lang="en">
<head>
<script src="/lab-guard.js"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Projects · Meridian</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=IBM+Plex+Mono:wght@300;400&family=Outfit:wght@300;400;500&family=Spectral:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b14;--panel:#0b111d;--ink:#eef3ff;--dim:#8089a8;--dim2:#565f78;--gold:#ffb23c;--hair:rgba(128,137,168,.16);--hairhi:rgba(128,137,168,.28)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Spectral,serif;font-weight:300;min-height:100vh}.wrap{max-width:1500px;margin:auto;padding:34px clamp(18px,4vw,64px) 60px}header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--hair);padding-bottom:18px}.word{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:3px}.nav{display:flex;gap:18px}.back,.label,.meta,button,select{font-family:'IBM Plex Mono',monospace}.back{color:var(--dim);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;text-decoration:none}.back:hover{color:var(--ink)}.hello{font:italic 400 18px Fraunces,serif;color:var(--dim);margin:48px 0 5px}h1{font:300 clamp(38px,6vw,72px)/1 Fraunces,serif;margin:0 0 14px}h1 em{color:var(--gold);font-weight:300}.lede{color:var(--dim);font-size:18px;max-width:670px;margin:0 0 36px}.capture{display:grid;grid-template-columns:minmax(220px,1fr) minmax(280px,2fr) auto;gap:10px;margin-bottom:42px}input,textarea,select{background:transparent;border:1px solid var(--hair);color:var(--ink);outline:none;padding:11px 12px;border-radius:0}textarea{font:300 15px Spectral,serif;resize:vertical;min-height:44px}input{font:300 15px Spectral,serif}input:focus,textarea:focus,select:focus{border-color:var(--hairhi)}button{background:transparent;border:1px solid var(--hairhi);color:var(--ink);text-transform:uppercase;letter-spacing:2px;font-size:10px;padding:0 18px;cursor:pointer}button:hover{color:var(--gold);border-color:var(--gold)}.board{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:16px;overflow-x:auto;padding:4px 0 20px}.column{min-height:360px;border-radius:10px;transition:background .18s ease}.column.drop-target{background:color-mix(in srgb,var(--gold) 7%,transparent)}.column h2{font:300 10px 'IBM Plex Mono',monospace;letter-spacing:2px;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--hair);padding:0 2px 10px;margin:0 0 12px;display:flex;justify-content:space-between}.card{border:1px solid var(--hair);padding:15px;margin-bottom:10px;background:var(--panel);cursor:grab;touch-action:pan-y;user-select:none;transform-origin:50% 8%;will-change:transform}.card:active{cursor:grabbing}.card.high{border-left:2px solid var(--gold)}.card.drag-source{opacity:.28}.drag-ghost{position:fixed;z-index:200;pointer-events:none;margin:0;width:var(--drag-width);box-shadow:0 18px 45px rgba(0,0,0,.2)!important;transition:none!important}.card.landed{animation:settle .65s cubic-bezier(.18,.9,.22,1)}@keyframes settle{0%{transform:rotate(0)}24%{transform:rotate(3.5deg) translateY(-5px)}52%{transform:rotate(-2.2deg) translateY(1px)}75%{transform:rotate(.8deg)}100%{transform:none}}.title{font:400 18px/1.2 Fraunces,serif}.note{color:var(--dim);font-size:14px;line-height:1.45;margin:8px 0 15px;white-space:pre-wrap}.controls{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.choice{position:relative;display:inline-flex;align-items:center;background:color-mix(in srgb,var(--bg) 55%,transparent);border-radius:6px}.choice::after{content:'⌄';position:absolute;right:7px;top:4px;color:var(--dim2);font:10px 'IBM Plex Mono',monospace;pointer-events:none}.choice select{appearance:none;border:0;background:transparent;font-size:9px;letter-spacing:.8px;text-transform:uppercase;padding:7px 22px 7px 8px;cursor:pointer}.brief{font:300 9px 'IBM Plex Mono',monospace;letter-spacing:.8px;text-transform:uppercase;color:var(--dim);display:flex;gap:6px;align-items:center;background:color-mix(in srgb,var(--bg) 55%,transparent);padding:6px 8px;border-radius:6px;cursor:pointer}.brief:has(input:checked){color:var(--ink);background:color-mix(in srgb,var(--gold) 18%,transparent)}.brief input{accent-color:var(--gold);width:11px;height:11px;margin:0}.meta{font-size:9px;color:var(--dim2);margin-top:10px}.empty{color:var(--dim2);font-style:italic;font-size:13px;padding:8px 2px}.status{font:300 10px 'IBM Plex Mono',monospace;color:var(--dim);min-height:18px;margin-top:-28px;margin-bottom:10px}@media(prefers-reduced-motion:reduce){.card.landed{animation:none}.drag-ghost{transform:none!important}}@media(max-width:780px){.capture{grid-template-columns:1fr}.capture button{min-height:42px}.board{grid-template-columns:repeat(5,82vw)}h1{font-size:46px}.hello{margin-top:34px}.nav{gap:11px}.word{font-size:10px}}
</style><link rel="stylesheet" href="/appearance.css"></head>
<body><div class="wrap"><header><span class="word">MERIDIAN · PROJECTS</span><nav class="nav"><a class="back token-link" href="/">Morning brief</a><a class="back token-link" href="/dashboard">Command centre</a></nav></header>
<p class="hello" id="hello">Hello, Owner.</p><h1>Your work, <em>in view.</em></h1><p class="lede">Drop the shape of a project here. Drag it when its real state changes. Brief is only a quiet signal for the morning, never another queue.</p>
<form class="capture" id="capture"><input id="title" maxlength="120" placeholder="Project name" required><textarea id="note" maxlength="2000" placeholder="Where it is, what matters, what is stuck…"></textarea><button>Add project</button></form><div class="status" id="status"></div>
<main class="board" id="board"></main></div>
<script>
'use strict';
const STATUSES=[['inbox','Inbox'],['next','Next'],['active','Active'],['waiting','Waiting'],['done','Done']];
const token=new URLSearchParams(location.search).get('t');
const api=(p)=>token?p+'?t='+encodeURIComponent(token):p;
const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hour=new Date().getHours();document.getElementById('hello').textContent=(hour<12?'Morning':hour<18?'Afternoon':'Evening')+', Owner.';
document.querySelectorAll('.token-link').forEach(a=>{if(token)a.href+=(a.href.includes('?')?'&':'?')+'t='+encodeURIComponent(token)});
let projects=[];
async function load(){const r=await fetch(api('/api/projects'));if(!r.ok)throw new Error('Projects unavailable');projects=(await r.json()).projects;render()}
function render(landedId){document.getElementById('board').innerHTML=STATUSES.map(([id,label])=>{const cards=projects.filter(p=>p.status===id).sort((a,b)=>(b.priority==='high')-(a.priority==='high')||String(b.updated).localeCompare(String(a.updated)));return `<section class="column" data-status="${id}"><h2>${label}<span>${cards.length}</span></h2>${cards.map(p=>card(p,p.id===landedId)).join('')||'<div class="empty">Clear.</div>'}</section>`}).join('')}
function card(p,landed){return `<article class="card ${p.priority==='high'?'high':''}${landed?' landed':''}" data-id="${p.id}"><div class="title">${esc(p.title)}</div>${p.note?`<div class="note">${esc(p.note)}</div>`:''}<div class="controls"><span class="choice"><select aria-label="Project state" data-field="status">${STATUSES.map(([id,label])=>`<option value="${id}" ${id===p.status?'selected':''}>${label}</option>`).join('')}</select></span><span class="choice"><select aria-label="Priority" data-field="priority"><option value="low" ${p.priority==='low'?'selected':''}>Low priority</option><option value="normal" ${p.priority==='normal'?'selected':''}>Normal priority</option><option value="high" ${p.priority==='high'?'selected':''}>High priority</option></select></span><label class="brief"><input type="checkbox" data-field="brief" ${p.brief?'checked':''}> Morning brief</label><label class="brief"><input type="checkbox" data-field="delegate" ${p.delegate?'checked':''}> Agent ready</label></div><div class="meta">Updated ${new Date(p.updated).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</div></article>`}
async function patchProject(id,patch,landed=false){const r=await fetch(api('/api/projects/'+id),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(patch)});const j=await r.json();if(!j.ok)throw new Error(j.error||'Update failed');const i=projects.findIndex(p=>p.id===id);if(i>=0)projects[i]=j.project;render(landed?id:null)}
document.getElementById('capture').addEventListener('submit',async e=>{e.preventDefault();const body={title:document.getElementById('title').value,note:document.getElementById('note').value};const r=await fetch(api('/api/projects'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!j.ok){document.getElementById('status').textContent=j.error;return}e.target.reset();document.getElementById('status').textContent='Captured';await load()});
document.getElementById('board').addEventListener('change',async e=>{const field=e.target.dataset.field;if(!field)return;const el=e.target.closest('[data-id]');const value=field==='brief'||field==='delegate'?e.target.checked:e.target.value;await patchProject(el.dataset.id,{[field]:value},field==='status')});
let drag=null;
document.getElementById('board').addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('select,input,label,button'))return;const source=e.target.closest('.card');if(!source)return;const rect=source.getBoundingClientRect();const ghost=source.cloneNode(true);ghost.classList.add('drag-ghost');ghost.style.setProperty('--drag-width',rect.width+'px');ghost.style.left=rect.left+'px';ghost.style.top=rect.top+'px';ghost.style.visibility='hidden';document.body.appendChild(ghost);drag={id:source.dataset.id,source,ghost,offsetX:e.clientX-rect.left,offsetY:e.clientY-rect.top,lastX:e.clientX,lastAt:performance.now(),active:false};source.setPointerCapture(e.pointerId)});
document.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-(parseFloat(drag.ghost.style.left)+drag.offsetX),dy=e.clientY-(parseFloat(drag.ghost.style.top)+drag.offsetY);if(!drag.active&&Math.hypot(dx,dy)<7)return;drag.active=true;e.preventDefault();drag.source.classList.add('drag-source');drag.ghost.style.visibility='visible';const now=performance.now(),velocity=(e.clientX-drag.lastX)/Math.max(now-drag.lastAt,1);drag.lastX=e.clientX;drag.lastAt=now;const angle=Math.max(-7,Math.min(7,velocity*18));drag.ghost.style.left=(e.clientX-drag.offsetX)+'px';drag.ghost.style.top=(e.clientY-drag.offsetY)+'px';drag.ghost.style.transform=`rotate(${angle}deg) scale(1.025)`;document.querySelectorAll('.column').forEach(c=>c.classList.remove('drop-target'));const hit=document.elementFromPoint(e.clientX,e.clientY)?.closest('.column');if(hit)hit.classList.add('drop-target')},{passive:false});
document.addEventListener('pointerup',async e=>{if(!drag)return;const current=drag;drag=null;document.querySelectorAll('.column').forEach(c=>c.classList.remove('drop-target'));current.ghost.remove();current.source.classList.remove('drag-source');if(!current.active)return;const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.column');if(!target)return;const project=projects.find(p=>p.id===current.id);if(project&&project.status!==target.dataset.status){try{await patchProject(current.id,{status:target.dataset.status},true);document.getElementById('status').textContent='Moved to '+STATUSES.find(([id])=>id===target.dataset.status)[1]}catch(err){document.getElementById('status').textContent=err.message}}});
load().catch(e=>document.getElementById('status').textContent=e.message);
</script><script src="/appearance.js"></script></body></html>
