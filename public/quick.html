<script>
// Same saved look as the command centre, before first paint.
try{const p=JSON.parse(localStorage.getItem('meridian.cc.prefs')||'{}');const r=document.documentElement;
  for(const [k,v] of Object.entries(p.look||{}))if(k!=='grain'&&k!=='tintStrength')r.dataset[k]=(k==='radius'&&v==='round')?'squircle':v;
  if(p.accent)r.style.setProperty('--accent',p.accent);}catch{}
const qs=new URLSearchParams(location.search);
if(qs.get('panel'))document.documentElement.dataset.panel=qs.get('panel');
</script>
<link rel="stylesheet" href="/command.css">
<style>
/* Structural labels must not depend on the optional focus helper. */
.a11y-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip-path:inset(50%)!important;white-space:nowrap!important;border:0!important}
/* The quick to-dos panel. In the Mac app it sits in a floating window with the
   blur behind it, so the page itself is see-through apart from the card. */
html,body{height:100%;overflow:hidden}
body{background:var(--frame);display:flex;align-items:flex-start;justify-content:center;padding:12vh 16px 16px}
[data-panel] body,[data-panel]{background:transparent}
[data-panel] body{padding:0;align-items:stretch}
.q{width:min(680px,100%);height:min(460px,calc(100vh - 14vh));height:min(460px,calc(100dvh - 14vh));display:flex;flex-direction:column;background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;position:relative}
[data-panel] .q{width:100%;height:100vh;height:100dvh;border-radius:0;box-shadow:none;background:color-mix(in srgb,var(--card) 78%,transparent)}
.qt{display:flex;align-items:center;gap:10px;padding:0 14px 0 18px;height:56px;flex:none}
.qt .ico{width:18px;height:18px;color:var(--dim);flex:none}
.qt input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:17px;color:var(--ink);letter-spacing:-.005em}
.qt input::placeholder{color:var(--dim2)}
.qt input,.qt input:focus,.acts input,.acts input:focus{border:0;box-shadow:none;outline:0;background:none;border-radius:0;height:auto}
.chip{flex:none;height:26px;padding:0 10px;border-radius:8px;border:0;background:var(--well);color:var(--body);font-size:12.5px;display:inline-flex;align-items:center;gap:6px;cursor:default}
.chip i{width:7px;height:7px;border-radius:2px;background:var(--dim2)}
.chip[data-p="now"] i{background:var(--accent)} .chip[data-p="later"] i{background:transparent;box-shadow:inset 0 0 0 1.5px var(--dim2)}
.qsep{height:1px;background:color-mix(in srgb,var(--ink) 7%,transparent);flex:none}
.ql{flex:1;overflow-y:auto;padding:6px 8px 10px;scrollbar-width:thin}
.gh{font-size:11.5px;font-weight:500;color:var(--dim2);padding:12px 10px 5px;letter-spacing:.02em;display:flex;gap:8px}
.gh .n{color:var(--dim2);font-family:var(--f-mono);font-size:10.5px;opacity:.8}
.r{display:flex;align-items:center;gap:11px;min-height:40px;padding:6px 10px;border-radius:9px;cursor:default;position:relative}
.r.sel{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.r .tk{width:18px;height:18px;border-radius:6px;flex:none;box-shadow:inset 0 0 0 1.5px var(--dim2);display:grid;place-items:center;background:none;border:0;padding:0}
.r .tk svg{width:12px;height:12px;stroke:var(--accent-ink);stroke-width:2.6;fill:none;opacity:0}
.r.now .tk{box-shadow:inset 0 0 0 1.5px var(--accent)}
.r.done .tk,.r.ticking .tk{background:var(--accent);box-shadow:none} .r.done .tk svg,.r.ticking .tk svg{opacity:1}
.r.done .t{color:var(--dim2);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--dim2) 60%,transparent)}
.r.ticking{opacity:.45;transition:opacity .25s}
.r .m{flex:1;min-width:0}
.r .t{font-size:14.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .s{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.r .tag{flex:none;font-size:11.5px;color:var(--dim);padding:2px 7px;border-radius:6px;background:var(--well)}
.r .tag.agent{color:var(--accent-text)}
.r.add .tk{box-shadow:none;background:var(--well)} .r.add .tk svg{opacity:1;stroke:var(--body)}
.r.add .t b{font-weight:500}
.r.brief .tk{border-radius:50%}
.r input.ed{width:100%;background:var(--well);border:0;outline:0;border-radius:6px;padding:3px 7px;margin:-3px -7px;font-size:14.5px;color:var(--ink)}
.empty{padding:34px 10px;text-align:center;color:var(--dim);font-size:13.5px}
.qf{flex:none;height:40px;display:flex;align-items:center;gap:14px;padding:0 12px 0 14px;font-size:12px;color:var(--dim)}
.qf .me{display:flex;align-items:center;gap:7px;color:var(--body);font-weight:500}
.qf .me svg{width:15px;height:15px}
.qf .msg{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--body)}
.qf .hints{display:flex;gap:12px;flex:none}
.qf kbd,.acts kbd{font-family:var(--f-body);font-size:11px;color:var(--body);background:var(--well);border-radius:5px;padding:1px 5px;margin-right:4px;min-width:18px;display:inline-block;text-align:center}
.acts{position:absolute;right:10px;bottom:46px;width:300px;max-height:330px;overflow:auto;background:var(--pop);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:none}
.acts.on{display:block}
.acts input{width:100%;padding:8px 9px 9px;font-size:13.5px;color:var(--ink)}
.acts .a{display:flex;align-items:center;gap:10px;height:32px;padding:0 9px;border-radius:7px;font-size:13.5px;color:var(--ink)}
.acts .a span{flex:1} .acts .a kbd{margin:0}
.acts .a.sel{background:color-mix(in srgb,var(--ink) 9%,transparent)}
.acts .a.danger{color:var(--bad)}
.off{padding:8px 12px;margin:8px 8px 0;border-radius:9px;background:var(--well);font-size:12.5px;color:var(--body)}
/* Touch: 40px tick hit area (look unchanged), no keyboard hints, footer title on one line. */
@media (pointer:coarse){
.r .tk{position:relative} .r .tk::before{content:'';position:absolute;inset:-11px}
.qf .hints{display:none} .qf .me{white-space:nowrap}
}
</style>
</head>
<body>
<div class="q" id="q" role="main"><h1 class="a11y-only">To-dos</h1>
  <div class="qt">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4.5"/><path d="m8.5 12.2 2.4 2.4 4.6-5"/></svg>
    <input id="in" placeholder="Add a to-do, or type to find one" autocomplete="off" spellcheck="false" maxlength="300" aria-label="Add or find a to-do">
    <button class="chip" id="prio" data-p="next" data-tip="Priority for the new one · Tab"><i></i><span>Next</span></button>
  </div>
  <div class="qsep"></div>
  <div class="ql" id="list" role="list" aria-label="To-dos"></div>
  <div class="qsep"></div>
  <div class="qf">
    <span class="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="8.4"/><line x1="12" y1="3.6" x2="12" y2="20.4"/><circle cx="12" cy="4.4" r="2" fill="var(--accent)" stroke="none"/></svg>To-dos</span>
    <span class="a11y-only" id="selection" role="status" aria-live="polite"></span>
    <span class="msg" id="msg" role="status" aria-live="polite"></span>
    <span class="hints" id="hints"></span>
  </div>
  <div class="acts" id="acts"><input id="acts-in" aria-label="Search actions" placeholder="Search actions" autocomplete="off" spellcheck="false"><div id="acts-l"></div></div>
</div>
<script src="/a11y.js"></script>
<script>
'use strict';
/* Quick to-dos. Keyboard first: type to add or find, arrows to move, Enter to
   tick, Tab for priority, ⌘K for everything else. Same /api/todos as Home. */
const $=(id)=>document.getElementById(id);
const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const token=qs.get('t');
const api=(p)=>token?p+(p.includes('?')?'&':'?')+'t='+encodeURIComponent(token):p;
async function send(p,body,method='POST'){
  const r=await fetch(api(p),{method,headers:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok||j.ok===false)throw new Error(j.error||('Request failed ('+r.status+')'));
  return j;
}
const App=()=>window.MeridianApp;
const coarse=()=>matchMedia('(pointer:coarse)').matches; // phones: don't pop the keyboard on every tap
const PRIOS=['now','next','later'], PRIO={now:'Now',next:'Next',later:'Later'};
const SRC={outlook:'Outlook',slack:'Slack',teams:'Teams',meridian:'Meridian'};
const TICK='<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="m6 12.5 4 4 8-9"/></svg>';
const PLUS='<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-width="2.2"><path d="M12 6v12M6 12h12"/></svg>';
const CACHE='meridian.quick.todos';
const isToday=(iso)=>{ if(!iso)return false; const d=new Date(iso),n=new Date(); return d.toDateString()===n.toDateString(); };

let todos=[], brief=[], rows=[], sel=0, nextKey=null, newPrio='next', editing=null, offline=false, undo=[], msgT=0;

/* ---------- data ---------- */
async function load(){
  try{
    const r=await fetch(api('/api/todos'),{cache:'no-store'}); if(!r.ok)throw new Error(r.status);
    todos=(await r.json()).todos||[]; offline=false;
    try{ localStorage.setItem(CACHE,JSON.stringify(todos)); }catch{}
  }catch{ offline=true; try{ todos=JSON.parse(localStorage.getItem(CACHE)||'[]'); }catch{ todos=[]; } }
  render(nextKey||undefined); nextKey=null;
  if(!offline)loadBrief();
}
// Items the morning brief found in mail and chat. Same rules as Home's to-do card.
async function loadBrief(){
  try{
    const s=await (await fetch(api('/api/state'),{cache:'no-store'})).json();
    const fb=s.briefFeedback||{completed:[],rejected:[],skipped:{}}; const day=new Date(); const today=`${day.getFullYear()}-${String(day.getMonth()+1).padStart(2,'0')}-${String(day.getDate()).padStart(2,'0')}`;
    const hidden=new Set([...(fb.completed||[]),...(fb.rejected||[]),...((fb.skipped&&fb.skipped[today])||[])]);
    const intake=new Map(((s.briefIntake||{}).items||[]).filter(i=>i.projectId).map(i=>[i.projectId,i]));
    const rank=(p)=>p==='high'?2:p==='normal'?1:0;
    brief=((s.projects&&s.projects.projects)||[]).filter(c=>c.brief&&c.status!=='done'&&!hidden.has('project:'+c.id)).map(p=>{ const i=intake.get(p.id);
      return {id:p.id,title:p.title,source:p.source||i?.source||'meridian',from:p.sourceFrom||i?.from||'',url:p.sourceUrl||i?.url||'',when:p.sourceReceivedAt||i?.receivedAt||p.updated,priority:p.priority}; })
      .sort((a,b)=>rank(b.priority)-rank(a.priority)||String(b.when||'').localeCompare(String(a.when||'')));
    render();
  }catch{}
}

/* ---------- rows ---------- */
function build(){
  const q=$('in').value.trim(), ql=q.toLowerCase(); const hit=(t)=>!ql||String(t).toLowerCase().includes(ql);
  const out=[];
  if(q&&!todos.some(t=>!t.done&&t.title.toLowerCase()===ql))out.push({kind:'add',title:q});
  const open=todos.filter(t=>!t.done&&hit(t.title));
  for(const p of PRIOS){ const g=open.filter(t=>(t.priority||'next')===p); if(g.length){ out.push({head:PRIO[p],n:g.length}); g.forEach(t=>out.push({kind:'todo',t})); } }
  const b=brief.filter(x=>hit(x.title)); if(b.length){ out.push({head:'From the brief',n:b.length}); b.forEach(x=>out.push({kind:'brief',b:x})); }
  const done=todos.filter(t=>t.done&&isToday(t.doneAt)&&hit(t.title)); if(done.length){ out.push({head:'Done today',n:done.length}); done.forEach(t=>out.push({kind:'todo',t})); }
  return out;
}
const pickable=()=>rows.map((r,i)=>r.head?-1:i).filter(i=>i>=0);
function render(keep){
  const prevKey=keep||keyOf(rows[sel]);
  rows=build();
  const idx=pickable(); if(!idx.length){ sel=-1; } else { const k=idx.find(i=>keyOf(rows[i])===prevKey); sel=k!==undefined?k:idx[0]; }
  const L=$('list');
  L.innerHTML=(offline?`<div class="off">Can't reach your Home Mac. Showing what you last saw; changes are off until it's back.</div>`:'')
    +(rows.length?rows.map((r,i)=>{
      if(r.head)return `<div class="gh">${esc(r.head)}<span class="n">${r.n}</span></div>`;
      if(r.kind==='add')return `<div class="r add${i===sel?' sel':''}" data-i="${i}" role="listitem" aria-current="${i===sel}"><span class="tk">${PLUS}</span><div class="m"><div class="t">Add <b>“${esc(r.title)}”</b></div></div><span class="tag">${PRIO[newPrio]}</span></div>`;
      if(r.kind==='brief'){ const x=r.b; return `<div class="r brief${i===sel?' sel':''}" data-i="${i}" role="listitem" aria-current="${i===sel}"><button class="tk" data-tick="${i}" aria-label="Done">${TICK}</button><div class="m"><div class="t">${esc(x.title)}</div><div class="s">${esc(SRC[x.source]||x.source)}${x.from?' · '+esc(x.from):''}</div></div></div>`; }
      const t=r.t; const ed=editing===t.id;
      return `<div class="r ${esc(t.priority||'next')}${t.done?' done':''}${i===sel?' sel':''}" data-i="${i}" role="listitem" aria-current="${i===sel}"><button class="tk" data-tick="${i}" aria-label="${t.done?'Not done':'Done'}">${TICK}</button><div class="m">${ed?`<input class="ed" id="ed" aria-label="To-do title" value="${esc(t.title)}" maxlength="200">`:`<div class="t">${esc(t.title)}</div>`}${t.note&&!ed?`<div class="s">${esc(t.note)}</div>`:''}</div>${t.delegation?`<span class="tag agent">${esc(t.delegation.model||'Agent')} ${esc(t.delegation.status||'')}</span>`:''}</div>`;
    }).join(''):`<div class="empty">${$('in').value.trim()?'Nothing matches.':'Nothing to do. Type to add one.'}</div>`);
  if(editing){ const e=$('ed'); if(e){ e.focus(); e.setSelectionRange(e.value.length,e.value.length); } }
  hints(); scrollSel();
}
function keyOf(r){ return !r||r.head?'':r.kind==='add'?'add':r.kind==='brief'?'b:'+r.b.id:'t:'+r.t.id; }
function scrollSel(){ $('list').querySelector('.r.sel')?.scrollIntoView({block:'nearest'}); }
function move(d){ const idx=pickable(); if(!idx.length)return; let p=idx.indexOf(sel); p=p<0?0:(p+d+idx.length)%idx.length; sel=idx[p]; $('list').querySelectorAll('.r').forEach(el=>{ const on=Number(el.dataset.i)===sel; el.classList.toggle('sel',on); el.setAttribute('aria-current',String(on)); }); hints(); scrollSel(); $('selection').textContent=$('list').querySelector('.r.sel .t')?.textContent||''; }
const cur=()=>rows[sel];

/* ---------- footer ---------- */
function say(text){ $('msg').textContent=text; clearTimeout(msgT); msgT=setTimeout(()=>{ $('msg').textContent=''; },3600); }
function hints(){
  const r=cur(); const k=(a,b)=>`<span><kbd>${a}</kbd>${b}</span>`;
  $('hints').innerHTML=editing?k('↵','Save')+k('esc','Cancel')
    :!r?k('esc','Close')
    :r.kind==='add'?k('↵','Add')+k('⇥','Priority')+k('esc','Clear')
    :r.kind==='brief'?k('↵','Done')+k('⌘K','Actions')
    :k('↵',r.t.done?'Not done':'Done')+k('⇥','Priority')+k('⌘E','Edit')+k('⌘K','Actions');
}
function setNewPrio(p){ newPrio=p; const c=$('prio'); c.dataset.p=p; c.querySelector('span').textContent=PRIO[p]; }

/* ---------- actions ---------- */
const guard=()=>{ if(offline){ say("Can't change anything while the Home Mac is offline"); return false; } return true; };
async function act(fn,okMsg,undoFn){
  if(!guard())return;
  try{ await fn(); if(undoFn)undo.push(undoFn); if(okMsg)say(okMsg+(undoFn?' · ⌘Z undoes it':'')); }catch(err){ say(err.message); }
  await load();
}
function add(title){
  const p=newPrio; $('in').value=''; setNewPrio('next');
  return act(async()=>{ const j=await send('/api/todos',{title,priority:p}); add.last=j.todo&&j.todo.id; }, `Added to ${PRIO[p]}`, ()=>add.last&&send('/api/todos/'+add.last,undefined,'DELETE'));
}
function primary(){
  const r=cur(); if(!r)return;
  if(r.kind==='add')return add(r.title);
  if(r.kind==='brief')return briefDone(r.b);
  return toggleDone(r.t);
}
function toggleDone(t){
  const el=$('list').querySelector('.r.sel'); if(el&&!t.done)el.classList.add('ticking');
  const idx=pickable(), p=idx.indexOf(sel); nextKey=keyOf(rows[idx[p+1]]??rows[idx[p-1]]);
  const to=!t.done; return act(()=>send('/api/todos/'+t.id,{done:to},'PATCH'), to?'Done':'Back on the list', ()=>send('/api/todos/'+t.id,{done:!to},'PATCH'));
}
function briefDone(b){ return act(()=>send('/api/brief-feedback',{id:'project:'+b.id,action:'complete'}),'Done').then(loadBrief); }
function briefReject(b){ return act(()=>send('/api/brief-feedback',{id:'project:'+b.id,action:'reject'}),'Hidden from the brief').then(loadBrief); }
function setPrio(t,p){ const old=t.priority||'next'; if(old===p)return; return act(()=>send('/api/todos/'+t.id,{priority:p},'PATCH'),'Moved to '+PRIO[p],()=>send('/api/todos/'+t.id,{priority:old},'PATCH')); }
function cyclePrio(dir){
  const r=cur(); if(!r||r.kind==='brief')return;
  if(r.kind==='add'){ setNewPrio(PRIOS[(PRIOS.indexOf(newPrio)+dir+3)%3]); render(); return; }
  if(r.t.done)return; setPrio(r.t,PRIOS[(PRIOS.indexOf(r.t.priority||'next')+dir+3)%3]);
}
function edit(){ const r=cur(); if(!r||r.kind!=='todo'||!guard())return; editing=r.t.id; render(); }
function saveEdit(commit){
  const e=$('ed'); const t=todos.find(x=>x.id===editing); editing=null;
  if(!commit||!e||!t||!e.value.trim()||e.value.trim()===t.title){ render(); $('in').focus(); return; }
  const old=t.title, v=e.value.trim(); $('in').focus();
  act(()=>send('/api/todos/'+t.id,{title:v},'PATCH'),'Saved',()=>send('/api/todos/'+t.id,{title:old},'PATCH'));
}
function del(){
  const r=cur(); if(!r)return; if(r.kind==='brief')return briefReject(r.b); if(r.kind!=='todo')return;
  const t=r.t; act(()=>send('/api/todos/'+t.id,undefined,'DELETE'),'Deleted',()=>send('/api/todos',{title:t.title,priority:t.priority,note:t.note,area:t.area}));
}
// ⌥↑ / ⌥↓ moves within its group; past the end of a group it changes priority.
function shift(d){
  const r=cur(); if(!r||r.kind!=='todo'||r.t.done||!guard())return;
  const open=todos.filter(t=>!t.done); const i=open.findIndex(t=>t.id===r.t.id); const j=i+d; const p=r.t.priority||'next';
  if(j<0||j>=open.length){ const k=PRIOS.indexOf(p)+d; if(k>=0&&k<3)setPrio(r.t,PRIOS[k]); return; }
  if((open[j].priority||'next')!==p){ setPrio(r.t,open[j].priority||'next'); return; }
  const ids=open.map(t=>t.id); [ids[i],ids[j]]=[ids[j],ids[i]]; const before=open.map(t=>t.id);
  act(()=>send('/api/todos/reorder',{ids}),'',()=>send('/api/todos/reorder',{ids:before}));
}
function delegate(){
  const r=cur(); if(!r||!guard())return;
  if(r.kind==='todo'&&!r.t.done)return act(()=>send('/api/todos/'+r.t.id+'/delegate',{}),'An agent is on it. Follow it in Dogfood.');
  if(r.kind==='brief')return act(()=>send('/api/delegate',{projectId:r.b.id,title:r.b.title}),'An agent is on it. Follow it in Dogfood.');
}
function openSource(){ const r=cur(); if(r?.kind==='brief'&&r.b.url)window.open(r.b.url,'_blank','noopener'); }
function openMeridian(){ const A=App(); if(A&&A.openMain){ A.openMain('home'); A.closePanel&&A.closePanel(); } else location.href='/dashboard#home'; }
function closePanel(){ const A=App(); if(A&&A.closePanel)A.closePanel(); }
async function doUndo(){ const f=undo.pop(); if(!f){ say('Nothing to undo'); return; } if(!guard())return; try{ await f(); say('Undone'); }catch(err){ say(err.message); } load(); }
function clearDone(){ return act(()=>send('/api/todos/clear-done'),'Cleared the done ones'); }

/* ---------- ⌘K actions ---------- */
let acts=[], actSel=0;
function actList(){
  const r=cur(); const L=[];
  if(r?.kind==='todo'){ const t=r.t;
    L.push({l:t.done?'Not done':'Done',k:'↵',f:()=>toggleDone(t)},{l:'Edit',k:'⌘E',f:edit});
    if(!t.done)PRIOS.forEach((p,i)=>L.push({l:(t.priority===p?'✓ ':'')+PRIO[p],k:'⌘'+(i+1),f:()=>setPrio(t,p)}));
    if(!t.done)L.push({l:'Move up',k:'⌥↑',f:()=>shift(-1)},{l:'Move down',k:'⌥↓',f:()=>shift(1)},{l:'Hand to an agent',k:'⌘D',f:delegate});
    L.push({l:'Delete',k:'⌘⌫',f:del,danger:true});
  } else if(r?.kind==='brief'){
    L.push({l:'Done',k:'↵',f:primary});
    if(r.b.url)L.push({l:'Open in '+(SRC[r.b.source]||'the source'),k:'⌘O',f:openSource});
    L.push({l:'Hand to an agent',k:'⌘D',f:delegate},{l:'Not for me',k:'⌘⌫',f:del,danger:true});
  }
  L.push({l:'Undo',k:'⌘Z',f:doUndo},{l:'Clear the done ones',k:'',f:clearDone},{l:'Open Meridian',k:'⌘⇧O',f:openMeridian});
  if(App()?.closePanel)L.push({l:'Close',k:'esc',f:closePanel});
  return L;
}
function actsOpen(){ $('acts').classList.add('on'); $('acts-in').value=''; actsRender(); $('acts-in').focus(); }
function actsClose(){ $('acts').classList.remove('on'); $('in').focus(); }
function actsRender(){ const q=$('acts-in').value.trim().toLowerCase(); acts=actList().filter(a=>!q||a.l.toLowerCase().includes(q)); actSel=Math.min(actSel,Math.max(0,acts.length-1));
  $('acts-l').innerHTML=acts.map((a,i)=>`<div class="a${i===actSel?' sel':''}${a.danger?' danger':''}" data-a="${i}"><span>${esc(a.l)}</span>${a.k?`<kbd>${a.k}</kbd>`:''}</div>`).join('')||'<div class="empty" style="padding:14px">No action</div>'; }
$('acts-in').addEventListener('input',()=>{ actSel=0; actsRender(); });
$('acts-l').addEventListener('click',e=>{ const a=e.target.closest('[data-a]'); if(!a)return; const f=acts[Number(a.dataset.a)]?.f; actsClose(); f&&f(); });

/* ---------- keys and mouse ---------- */
$('in').addEventListener('input',()=>render('add'));
$('prio').addEventListener('click',()=>{ setNewPrio(PRIOS[(PRIOS.indexOf(newPrio)+1)%3]); render(); $('in').focus(); });
document.addEventListener('keydown',e=>{
  const k=e.key, cmd=e.metaKey||e.ctrlKey;
  if($('acts').classList.contains('on')){
    if(k==='Escape'){ e.preventDefault(); actsClose(); return; }
    if(k==='ArrowDown'||k==='ArrowUp'){ e.preventDefault(); actSel=(actSel+(k==='ArrowDown'?1:-1)+acts.length)%Math.max(1,acts.length); actsRender(); return; }
    if(k==='Enter'){ e.preventDefault(); const f=acts[actSel]?.f; actsClose(); f&&f(); return; }
    if(cmd&&k.toLowerCase()==='k'){ e.preventDefault(); actsClose(); }
    return;
  }
  if(editing){ if(k==='Enter'){ e.preventDefault(); saveEdit(true); } else if(k==='Escape'){ e.preventDefault(); saveEdit(false); } return; }
  if(k==='ArrowDown'&&!e.altKey){ e.preventDefault(); move(1); return; }
  if(k==='ArrowUp'&&!e.altKey){ e.preventDefault(); move(-1); return; }
  if(e.altKey&&(k==='ArrowUp'||k==='ArrowDown')){ e.preventDefault(); shift(k==='ArrowUp'?-1:1); return; }
  if(k==='Enter'){ if(e.target.closest('button,a'))return; e.preventDefault(); primary(); return; }
  // Tab follows the controls so the floating panel has a keyboard exit.
  if(k==='Tab')return;
  if(k==='Escape'){ e.preventDefault(); if($('in').value){ $('in').value=''; render(); } else closePanel(); return; }
  if(cmd){ const l=k.toLowerCase();
    if(l==='k'){ e.preventDefault(); actsOpen(); return; }
    if(l==='e'){ e.preventDefault(); edit(); return; }
    if(l==='d'){ e.preventDefault(); delegate(); return; }
    if(l==='z'&&!e.shiftKey&&!$('in').value){ e.preventDefault(); doUndo(); return; }
    if(k==='Backspace'&&!$('in').value){ e.preventDefault(); del(); return; }
    if(['1','2','3'].includes(k)){ e.preventDefault(); const r=cur(); if(r?.kind==='todo'&&!r.t.done)setPrio(r.t,PRIOS[Number(k)-1]); else if(r?.kind==='add'){ setNewPrio(PRIOS[Number(k)-1]); render(); } return; }
    if(l==='o'){ e.preventDefault(); e.shiftKey?openMeridian():openSource(); return; }
  }
});
$('list').addEventListener('click',e=>{
  const tk=e.target.closest('[data-tick]'); const row=e.target.closest('.r'); if(!row)return;
  const touch=coarse(); if(touch&&e.target.closest('.ed'))return; // tapping the edit field must not rebuild it
  const txt=!!e.target.closest('.m'); sel=Number(row.dataset.i); render(keyOf(rows[sel]));
  if(tk||rows[sel]?.kind==='add')primary();
  if(touch){ if(!tk&&txt&&rows[sel]?.kind==='todo')edit(); else if(rows[sel]?.kind==='add')$('in').focus(); return; } // phone: tap the text to edit (same as double-click)
  $('in').focus();
});
$('list').addEventListener('dblclick',e=>{ const row=e.target.closest('.r'); if(!row||e.target.closest('[data-tick]'))return; sel=Number(row.dataset.i); edit(); });
$('list').addEventListener('mousedown',e=>{ if(!e.target.closest('input'))e.preventDefault(); });

// The Mac app calls this every time the panel appears: fresh data, typing ready.
window.__meridianPanelShown=()=>{ editing=null; actsClose(); $('in').value=''; render(); $('in').focus(); load(); };
addEventListener('focus',()=>{ if(!editing)$('in').focus(); });
$('in').focus(); load();
</script>
